<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Biblioteca digital da turma de Ciência da Computação 02/26 - Uninter. Busque e abra livros em PDF por título, autor ou categoria.">
    <title>Minha Biblioteca de CC - Uninter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 Biblioteca de Ciência da Computação</h1>
        <p>Material compartilhado pela turma - 02/26</p>
    </header>

    <main class="container">
        <div class="busca-container">
            <input type="search" id="campoBusca" placeholder="Pesquisar por título, autor ou categoria..." aria-label="Pesquisar livros" autocomplete="off">
            <select id="ordemAlfabetica" aria-label="Ordenar livros">
                <option value="az">Título (A-Z)</option>
                <option value="za">Título (Z-A)</option>
                <option value="autor">Autor (A-Z)</option>
            </select>
        </div>

        <div id="filtroCategorias" class="filtro-categorias" role="group" aria-label="Filtrar por categoria"></div>

        <p id="contador" class="contador" aria-live="polite"></p>

        <div id="estante" class="grade-livros">
            <p>Carregando livros...</p>
        </div>
        <noscript><p class="sem-resultados">Ative o JavaScript para ver a lista de livros.</p></noscript>
    </main>

    <footer>
        <p>Feito com ❤️ por Sapo9841</p>
    </footer>

    <script src="livros.js"></script>
    <script src="script.js"></script>
</body>
</html>
